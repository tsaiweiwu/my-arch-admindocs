site_name: Skipjack Admin Docs
site_description: Administrator documentation for the Skipjack HPC cluster (ARCH @ JHU)
repo_url: https://github.com/jhu-arch/arch-admindocs
edit_uri: edit/main/docs/
copyright: Advanced Research Computing at Hopkins (ARCH)

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Old URLs (before the cluster / sse / systems split, 2026-10-28) keep working.
